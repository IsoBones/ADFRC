// adfrc_fremantle model.cfg
// Turret rig follows adfrc_lrpv (OtocVez/OtocHlaven, rotationY/X, memory axes).
// Driver and captain proxies translate between the wheelhouse chairs and the conning seats
// (user sources driver_conning / captain_conning, driven by scroll actions in config.cpp).
class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};
	class adfrc_fremantle_skeleton: Default
	{
		skeletonBones[] =
		{
			// Bofors 40/60
			"OtocVez","",
			"OtocHlaven","OtocVez",
			"zasleh","OtocHlaven",
			// port M2
			"OtocVez_2","",
			"OtocHlaven_2","OtocVez_2",
			"zasleh_2","OtocHlaven_2",
			"m2_2_hand_l","OtocHlaven_2",
			"m2_2_hand_r","OtocHlaven_2",
			// starboard M2
			"OtocVez_3","",
			"OtocHlaven_3","OtocVez_3",
			"zasleh_3","OtocHlaven_3",
			"m2_3_hand_l","OtocHlaven_3",
			"m2_3_hand_r","OtocHlaven_3",
			// crew moving to the conning seats
			"driver_move","",
			"commander_move","",
			// stowed Assault Boat proxy
			"assaultboat","",
			// always-spinning radar, propellers
			"radar","",
			"prop_1","",
			"prop_2","",
			// helm wheels
			"drivingwheel","",
			"drivingwheel_2",""
		};
	};
};
class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};
	class adfrc_fremantle: Default
	{
		skeletonName = "adfrc_fremantle_skeleton";
		sections[] = {"zasleh","zasleh_2","zasleh_3"};
		class Animations
		{
			// helm wheels, wheelhouse + conning position (source and angles as BI Test_Boat_01)
			class drivingWheel
			{
				type = "rotation";
				source = "drivingWheel";
				selection = "drivingwheel";
				axis = "drivingwheel_axis";
				memory = 1;
				minValue = -1;
				maxValue = 1;
				angle0 = -2;
				angle1 = 2;
			};
			class drivingWheel_2: drivingWheel
			{
				selection = "drivingwheel_2";
				axis = "drivingwheel_2_axis";
			};
			class MainTurret
			{
				type = "rotationY";
				source = "mainTurret";
				selection = "OtocVez";
				axis = "osaveze";
				memory = 1;
				animPeriod = 0;
				minValue = "rad -360";
				maxValue = "rad 360";
				angle0 = "rad -360";
				angle1 = "rad 360";
			};
			class MainGun: MainTurret
			{
				type = "rotationX";
				source = "mainGun";
				selection = "OtocHlaven";
				axis = "osahlavne";
			};
			class PortTurret: MainTurret
			{
				source = "portTurret";
				selection = "OtocVez_2";
				axis = "osaveze_2";
			};
			class PortGun: MainGun
			{
				source = "portGun";
				selection = "OtocHlaven_2";
				axis = "osahlavne_2";
			};
			class StbdTurret: MainTurret
			{
				source = "stbdTurret";
				selection = "OtocVez_3";
				axis = "osaveze_3";
			};
			class StbdGun: MainGun
			{
				source = "stbdGun";
				selection = "OtocHlaven_3";
				axis = "osahlavne_3";
			};
			// axis runs from the wheelhouse position to the conning seat, offset 1 = full axis length
			class driver_move
			{
				type = "translation";
				source = "driver_conning";
				selection = "driver_move";
				axis = "driver_move_axis";
				memory = 1;
				animPeriod = 0;
				minValue = 0;
				maxValue = 1;
				offset0 = 0;
				offset1 = 1;
			};
			class commander_move: driver_move
			{
				source = "captain_conning";
				selection = "commander_move";
				axis = "commander_move_axis";
			};
			// radar turns constantly: timer source, one revolution per 3 s
			class radar_spin
			{
				type = "rotation";
				source = "time";
				sourceAddress = "loop";
				selection = "radar";
				axis = "radar_axis";
				memory = 1;
				minValue = 0;
				maxValue = 3;
				angle0 = 0;
				angle1 = "rad 360";
			};
			// propellers, same setup as BI Test_Boat_01 (rotor source, looped)
			class prop_1
			{
				type = "rotation";
				source = "rotor";
				sourceAddress = "loop";
				selection = "prop_1";
				axis = "prop_1_axis";
				memory = 1;
				minValue = -1;
				maxValue = 1;
				angle0 = "rad 0";
				angle1 = "rad 2880";
			};
			class prop_2: prop_1
			{
				selection = "prop_2";
				axis = "prop_2_axis";
				angle1 = "rad -2880";
			};
			class assaultboat_hide
			{
				type = "hide";
				source = "assaultboat_deployed";
				selection = "assaultboat";
				minValue = 0;
				maxValue = 1;
				hideValue = 0.5;
			};
		};
	};
};
