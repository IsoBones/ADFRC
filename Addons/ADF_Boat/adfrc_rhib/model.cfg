// adfrc_rhib model.cfg (unarmed RHIB)
class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};
	class adfrc_rhib_skeleton: Default
	{
		skeletonBones[] =
		{
			"volant","",
			"volant_hand_l","volant",       // driver IK: left hand on the rim at 11 o'clock
			"throttle","",
			"throttle_hand_r","throttle"    // driver IK: right hand on the throttle knob
		};
	};
};
class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};
	class adfrc_rhib: Default
	{
		skeletonName = "adfrc_rhib_skeleton";
		sections[] = {"clan","clan_sign"};
		class Animations
		{
			// helm wheel follows the steering input
			class volant
			{
				type = "rotation";
				source = "drivingWheel";
				selection = "volant";
				begin = "osavolantzac";
				end = "osavolantkon";
				memory = 1;
				minValue = -1;
				maxValue = 1;
				angle0 = "rad 120";
				angle1 = "rad -120";
			};
			// throttle lever follows engine rpm (BI's Motorboat drives its throttle from "rpm" the same way)
			class throttle
			{
				type = "rotation";
				source = "rpm";
				selection = "throttle";
				axis = "throttle_axis";
				memory = 1;
				minValue = 200;
				maxValue = 1050;
				angle0 = "rad 0";
				angle1 = "rad -40";
			};
		};
	};
};
