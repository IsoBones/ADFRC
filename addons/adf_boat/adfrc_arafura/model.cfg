// adfrc_arafura model.cfg (adfrc_arafura.p3d, Typhoon 25mm)
// Turret rig follows the Fremantle / adfrc_lrpv (OtocVez/OtocHlaven, rotationY/X, memory axes).
class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};
	class adfrc_arafura_skeleton: Default
	{
		skeletonBones[] =
		{
			// main gun (Typhoon)
			"OtocVez","",
			"OtocHlaven","OtocVez",
			"zasleh","OtocHlaven",
			// port M2 (bridge wing)
			"OtocVez_2","",
			"OtocHlaven_2","OtocVez_2",
			"zasleh_2","OtocHlaven_2",
			"m2_2_hand_l","OtocHlaven_2",
			"m2_2_hand_r","OtocHlaven_2",
			// starboard M2 (bridge wing)
			"OtocVez_3","",
			"OtocHlaven_3","OtocVez_3",
			"zasleh_3","OtocHlaven_3",
			"m2_3_hand_l","OtocHlaven_3",
			"m2_3_hand_r","OtocHlaven_3",
			// stowed davit RHIBs
			"rhib_p","",
			"rhib_s","",
			// ASM camera (captain), invisible: rotates the asm_cam optics point only
			"OtocVez_cmd","",
			"OtocHlaven_cmd","OtocVez_cmd",
			// always-spinning radars (main + four lower arrays), propellers
			"radar","",
			"radar_2","",
			"radar_3","",
			"radar_4","",
			"radar_5","",
			// mission bay containers (garage option, hidden by default), stern door
			"containers","",
			"stern_door","",
			"prop_1","",
			"prop_2",""
		};
	};
};
class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};
	class adfrc_arafura: Default
	{
		skeletonName = "adfrc_arafura_skeleton";
		sections[] = {"zasleh","zasleh_2","zasleh_3"};
		class Animations
		{
			class MainTurret
			{
				type = "rotationY";
				source = "mainTurret";
				selection = "OtocVez";
				axis = "osaveze";
				memory = 1;
				animPeriod = 0;
				minValue = "rad -360";
				maxValue = "rad 360";
				angle0 = "rad -360";
				angle1 = "rad 360";
			};
			class MainGun: MainTurret
			{
				type = "rotationX";
				source = "mainGun";
				selection = "OtocHlaven";
				axis = "osahlavne";
			};
			class PortTurret: MainTurret
			{
				source = "portTurret";
				selection = "OtocVez_2";
				axis = "osaveze_2";
			};
			class PortGun: MainGun
			{
				source = "portGun";
				selection = "OtocHlaven_2";
				axis = "osahlavne_2";
			};
			class StbdTurret: MainTurret
			{
				source = "stbdTurret";
				selection = "OtocVez_3";
				axis = "osaveze_3";
			};
			class StbdGun: MainGun
			{
				source = "stbdGun";
				selection = "OtocHlaven_3";
				axis = "osahlavne_3";
			};
			// ASM camera turret (captain)
			class CmdTurret: MainTurret
			{
				source = "cmdTurret";
				selection = "OtocVez_cmd";
				axis = "osaveze_cmd";
			};
			class CmdGun: MainGun
			{
				source = "cmdGun";
				selection = "OtocHlaven_cmd";
				axis = "osahlavne_cmd";
			};
			// radar turns constantly: timer source, one revolution per 3 s
			class radar_spin
			{
				type = "rotation";
				source = "time";
				sourceAddress = "loop";
				selection = "radar";
				axis = "radar_axis";
				memory = 1;
				minValue = 0;
				maxValue = 3;
				angle0 = 0;
				angle1 = "rad 360";
			};
			// lower array antennas: same timer source, staggered speeds/directions so they don't turn in lockstep
			class radar_2_spin: radar_spin
			{
				selection = "radar_2";
				axis = "radar_2_axis";
				maxValue = 4;
			};
			class radar_3_spin: radar_spin
			{
				selection = "radar_3";
				axis = "radar_3_axis";
				maxValue = 4;
				angle1 = "rad -360";
			};
			class radar_4_spin: radar_spin
			{
				selection = "radar_4";
				axis = "radar_4_axis";
				maxValue = 5;
			};
			class radar_5_spin: radar_spin
			{
				selection = "radar_5";
				axis = "radar_5_axis";
				maxValue = 5;
				angle1 = "rad -360";
			};
			// propellers, same setup as BI Test_Boat_01 (rotor source, looped)
			class prop_1
			{
				type = "rotation";
				source = "rotor";
				sourceAddress = "loop";
				selection = "prop_1";
				axis = "prop_1_axis";
				memory = 1;
				minValue = -1;
				maxValue = 1;
				angle0 = "rad 0";
				angle1 = "rad 2880";
			};
			class prop_2: prop_1
			{
				selection = "prop_2";
				axis = "prop_2_axis";
				angle1 = "rad -2880";
			};
			class rhib_p_hide
			{
				type = "hide";
				source = "rhib_p_deployed";
				selection = "rhib_p";
				minValue = 0;
				maxValue = 1;
				hideValue = 0.5;
			};
			class rhib_s_hide: rhib_p_hide
			{
				source = "rhib_s_deployed";
				selection = "rhib_s";
			};
			// Garage option "Mission bay containers": source phase 1 = hidden (default)
			class containers_hide: rhib_p_hide
			{
				source = "hide_containers";
				selection = "containers";
			};
			// Stern door: hinged at its bottom edge, swings aft and down to extend the ramp (90 + 16 deg ramp slope)
			class stern_door
			{
				type = "rotationX";
				source = "stern_door";
				selection = "stern_door";
				axis = "stern_door_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = 0;
				angle1 = "rad 106";
			};
		};
	};
};
