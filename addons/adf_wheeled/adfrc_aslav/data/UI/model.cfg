// ASLAV-S camera operator optic: 3D vehicle icon (adfrc_aslav_s_ui.p3d)
// Driven every frame by adfrc_aslav_fnc_cameraOpticUI via ctrlAnimateModel.
//
// Mast offsets mirror the vehicle model.cfg 1:1 (metres, negative = up along mast_axis,
// which is 1 m long at icon scale). To compress the mast travel on the HUD, scale
// all six offset1 values by the same factor.

class CfgSkeletons
{
	class adfrc_aslav_s_ui_skeleton
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] =
		{
			"elev1",			"",
			"elev2",			"elev1",
			"elev3",			"elev2",
			"elev4",			"elev3",
			"elev5",			"elev4",
			"cameraelevation",	"elev5",
			"cameraturret",		"cameraelevation",
			"cameragun",		"cameraturret"
		};
	};
};

class CfgModels
{
	class adfrc_aslav_s_ui
	{
		skeletonName = "adfrc_aslav_s_ui_skeleton";
		sectionsInherit = "";
		sections[] = {};
		class Animations
		{
			// vehicle source: cameraelevation_deployed (door, 0..1)
			class elev1
			{
				type = "translation";
				source = "deploy";
				selection = "elev1";
				axis = "mast_axis";
				minValue = 0;
				maxValue = 1;
				offset0 = 0;
				offset1 = -1;
			};
			class elev2: elev1
			{
				selection = "elev2";
				offset1 = -1.5;
			};
			class elev3: elev1
			{
				selection = "elev3";
				offset1 = -2;
			};
			class elev4: elev1
			{
				selection = "elev4";
				offset1 = -2.5;
			};
			class elev5: elev1
			{
				selection = "elev5";
				offset1 = -3;
			};
			class cameraelevation_deployed: elev1
			{
				selection = "cameraelevation";
				offset1 = -0.5;
			};
			// vehicle source: cameraelevation (camera operator fine elevation, 0..1)
			class cameraelevation: elev1
			{
				source = "elev";
				selection = "cameraelevation";
				offset1 = -0.5;
			};
			// vehicle source: cameragun (radians). If the head tilts the wrong way in game,
			// swap angle0 and angle1.
			class cameragun
			{
				type = "rotation";
				source = "gun";
				selection = "cameragun";
				axis = "cameragun_axis";
				minValue = "rad -360";
				maxValue = "rad 360";
				angle0 = "rad 360";
				angle1 = "rad -360";
			};
		};
	};
};
